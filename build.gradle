plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = '0.12.3-alpha'
group = 'com.eldritchartifice'

base {
    archivesName = 'eldritchartifice'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                eldritchartifice {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods {
                eldritchartifice {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.5'
    implementation fg.deobf('curse.maven:mana-and-artifice-406360:6847805')
    implementation fg.deobf('curse.maven:dimensionaldoors-284876:6421500')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'eldritchartifice',
                'Specification-Vendor'    : 'Eldritch Artifice',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'Eldritch Artifice',
                'MixinConfigs'            : 'eldritchartifice.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forge supplies Maven POMs; do not require optional Gradle module metadata.
repositories.configureEach { repo ->
    if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('minecraftforge.net')) {
        repo.metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() }
    }
}
