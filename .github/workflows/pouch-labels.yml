name: Standalone Pouch Labels
on:
  push:
    paths:
      - 'standalone/pouch-ritual-labels/**'
      - '.github/workflows/pouch-labels.yml'
  pull_request:
    paths:
      - 'standalone/pouch-ritual-labels/**'
      - '.github/workflows/pouch-labels.yml'
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test standalone mod
        run: ./gradlew -p standalone/pouch-ritual-labels build --no-daemon
      - name: Validate release JAR
        run: python3 standalone/pouch-ritual-labels/scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: pouch-ritual-labels-0.1.0-alpha
          path: standalone/pouch-ritual-labels/build/libs/pouch-ritual-labels-0.1.0-alpha.jar
          if-no-files-found: error
