authors="Prototype build"
description='''
An Eldritch faction addon prototype for Mana and Artifice with Dimensional Doors integration.
This build adds normal progression recipes for the Eldritch spell components, the Rite of the Open
Eye faction-joining ritual, and Open Eye armor integration with Dimensional Doors' monolith
gaze-defying equipment tag. Full Open Eye armor also rejects Eldritch Watcher collection. Existing
Teleport, Staff of the Open Way, Temporal Distortion, Displacement, Warp, Reserve overcasting,
Watchers, devsetup, and Dimensional Doors integration remain included.
'''

